services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-f1
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
